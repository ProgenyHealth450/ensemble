name: Secret Scan

# Org-owned repo: gitleaks/gitleaks-action requires a GITLEAKS_LICENSE secret for
# organizations, so run the open-source CLI directly instead.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan commits introduced by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            # New branch or unreachable "before": scan what the push adds over the default branch.
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            RANGE="origin/${DEFAULT_BRANCH}..${PUSH_SHA}"
          fi
          echo "Scanning commit range: $RANGE"
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts="$RANGE"
