name: Sync from upstream

# This file lives on `automation`, not on `main`, for two reasons:
#
#   1. GitHub only fires `schedule:` triggers from a repository's DEFAULT
#      branch. `automation` is this fork's default branch so that this cron
#      actually runs.
#   2. `main` and `stable` are byte-pure mirrors of Sunstone-Partners/ensemble.
#      A workflow file committed to `main` would ride along on every feature/*
#      branch cut from it and appear in the diff of every PR sent upstream.
#
# What it does: fast-forward `main` from upstream unconditionally, then advance
# `stable` -- the ref the team's plugin marketplace clones -- only if that commit
# survives a real Windows consumer test. See README.md on this branch.

on:
  schedule:
    - cron: '17 7 * * *'   # daily 07:17 UTC; off-the-hour to dodge GitHub's cron backlog
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: Sunstone-Partners/ensemble

jobs:
  sync-main:
    name: Fast-forward main
    runs-on: ubuntu-latest
    outputs:
      needs_promote: ${{ steps.sync.outputs.needs_promote }}
    steps:
      - id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          UP=$(gh api "repos/$UPSTREAM/git/refs/heads/main" --jq '.object.sha')
          echo "upstream main: $UP"

          # Fast-forward-only; the API refuses to clobber a diverged fork. Any
          # failure here is diagnosed by the SHA assertion below rather than by
          # trying to interpret the response body.
          gh api "repos/$GITHUB_REPOSITORY/merge-upstream" -X POST -f branch=main --jq '.message' || true

          MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')
          if [ "$MAIN" != "$UP" ]; then
            echo "::error::main is at $MAIN but upstream is at $UP - the fork's main has diverged and cannot be fast-forwarded. Someone committed to main directly; it is supposed to be a pure mirror."
            exit 1
          fi
          echo "main is in sync at $MAIN"

          STABLE=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" --jq '.object.sha')
          if [ "$STABLE" = "$MAIN" ]; then
            echo "needs_promote=false" >> "$GITHUB_OUTPUT"
            echo "stable already at $MAIN - nothing to promote"
          else
            echo "needs_promote=true" >> "$GITHUB_OUTPUT"
            echo "stable is at $STABLE, main is at $MAIN - gate will decide"
          fi

  gate:
    name: Windows consumer gate
    needs: sync-main
    if: needs.sync-main.outputs.needs_promote == 'true'
    runs-on: windows-latest
    outputs:
      tested_sha: ${{ steps.clone.outputs.sha }}
    steps:
      # Clone exactly the way a teammate's machine does. Git for Windows leaves
      # core.symlinks=false unless the installer's symlink option was ticked, so
      # this is the configuration that actually ships to people.
      - id: clone
        name: Clone as a Windows consumer (core.symlinks=false)
        shell: bash
        run: |
          set -euo pipefail
          git -c core.symlinks=false clone --depth 1 --branch main \
            "https://github.com/$GITHUB_REPOSITORY" candidate
          cd candidate
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "testing $SHA"

      # A path containing ':' is unrepresentable on NTFS and aborts checkout on
      # every Windows machine. This broke the marketplace clone org-wide once
      # already (upstream PR #13, 38 offending paths under SessionLogs/).
      - name: No colon paths
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          if git ls-tree -r HEAD --name-only | grep ':'; then
            echo "::error::paths above contain ':' and cannot be checked out on Windows"
            exit 1
          fi
          echo "no colon paths"

      # The file Claude Code reads to enumerate every plugin. If it is committed
      # as a symlink, a core.symlinks=false checkout materializes it as a ~19
      # byte text file holding the link target, and the whole marketplace fails
      # to load. Upstream PR #51.
      - name: Loaded manifest parses as JSON
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = '.claude-plugin/marketplace.json';
            const raw = fs.readFileSync(p, 'utf8');
            try {
              const m = JSON.parse(raw);
              console.log('ok:', p, '->', (m.plugins || []).length, 'plugins');
            } catch (e) {
              console.error('::error::' + p + ' is not valid JSON on a Windows checkout. First 80 bytes: ' + JSON.stringify(raw.slice(0, 80)));
              console.error('If that looks like a path, the file is committed as a symlink. It must be a regular file.');
              process.exit(1);
            }
          "

      # NOTE: `npm run validate` is deliberately NOT run here. Upstream's own CI
      # already runs it on ubuntu, and the only Windows-specific thing it adds is
      # a check on packages/full/skills/, which is permanently red on a
      # core.symlinks=false checkout: 97 paths under packages/full/ are symlinks,
      # so a Windows clone turns them all into short text files. That is a real
      # pre-existing problem with the ensemble-full bundle, but it does not stop
      # the marketplace installing, and gating `stable` on it would freeze the
      # ref forever. This gate blocks only on what actually breaks installation.

  promote-stable:
    name: Advance stable
    needs: [sync-main, gate]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.gate.outputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # No `force`, so GitHub rejects anything that is not a fast-forward.
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -X PATCH -f sha="$SHA" --jq '.object.sha'
          echo "stable advanced to $SHA"
          echo "### stable advanced to \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # dev is not a mirror -- it is main plus whatever is still in flight upstream, so it
  # cannot be fast-forwarded. It is REBUILT from main each run rather than merged into
  # forever. That is the property that keeps it healthy: when a PR merges upstream it
  # drops off the open list on its own and its content arrives via main, instead of
  # lingering as a duplicate-SHA commit that re-conflicts on every later merge.
  #
  # Consequence: dev is disposable. Never commit to it directly -- the next rebuild
  # discards anything that is not main or an open PR.
  #
  # Deliberately independent of the stable gate: dev exists for dogfooding, so it should
  # track main even on a commit that stable is not allowed to have.
  rebuild-dev:
    name: Rebuild dev
    needs: sync-main
    runs-on: ubuntu-latest
    env:
      DEV_PR_AUTHOR: michaeldevenney
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: dev = main + open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/$UPSTREAM" 2>/dev/null || true
          git fetch -q upstream main
          git fetch -q origin dev

          git checkout -q -B dev upstream/main
          echo "reset dev to $(git rev-parse --short HEAD) (upstream main)"

          # refs/pull/N/head resolves no matter where the PR head lives -- this fork, a
          # personal fork, or upstream itself -- so this keeps working unchanged if
          # contributions later move to branches on the upstream repo directly.
          PRS=$(gh pr list --repo "$UPSTREAM" --state open --author "$DEV_PR_AUTHOR" \
                  --json number,title --jq '.[] | "\(.number)\t\(.title)"')

          if [ -z "$PRS" ]; then
            echo "no open PRs by $DEV_PR_AUTHOR - dev is just main"
          else
            while IFS=$'\t' read -r N TITLE; do
              [ -n "$N" ] || continue
              echo "folding in #$N: $TITLE"
              git fetch -q upstream "pull/$N/head"
              if ! git merge --no-ff -q -m "dogfood: fold in #$N ($TITLE)" FETCH_HEAD; then
                git merge --abort || true
                echo "::error::PR #$N conflicts with this rebuild - dev left unchanged. Rebase the PR, or close it to drop it from dev."
                exit 1
              fi
            done <<< "$PRS"
          fi

          # Folding version bumps from several branches can leave the two manifests
          # disagreeing. On a branch headed upstream that is a defect worth failing on;
          # on dev it is noise, and dev is never PR'd, so just repair it.
          if ! cmp -s marketplace.json .claude-plugin/marketplace.json; then
            cp marketplace.json .claude-plugin/marketplace.json
            git add .claude-plugin/marketplace.json
            git commit -q -m "chore(marketplace): re-sync loaded manifest after fold"
            echo "re-synced .claude-plugin/marketplace.json"
          fi

          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/dev^{tree}')" ]; then
            echo "dev content is already correct - not pushing"
            exit 0
          fi

          git push --force-with-lease=dev:"$(git rev-parse origin/dev)" origin dev
          echo "### dev rebuilt at `$(git rev-parse --short HEAD)`" >> "$GITHUB_STEP_SUMMARY"
