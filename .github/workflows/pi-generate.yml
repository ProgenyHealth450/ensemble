name: Pi Generate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages/pi
        run: npm run build --workspace=packages/pi

      # PI-CI-001: Generate Pi artifacts from source
      - name: Generate Pi artifacts
        run: npm run generate:pi

      # PI-CI-002: Drift detection - fail if generated artifacts differ from committed versions
      #
      # Guards packages/pi/commands, the actual output directory since the move
      # off prompts/. This previously pointed at prompts/, which the generator
      # no longer writes, so the check passed vacuously and real drift in
      # commands/ went unnoticed.
      #
      # The colon-namespaced commands/ensemble:*.md files are gitignored (illegal
      # on NTFS, generated at publish time), so git diff correctly ignores them
      # here; the committed ensemble-full-*.md aliases are what gets compared.
      - name: Check for stale generated output
        run: |
          PATHS="packages/pi/commands packages/pi/agents packages/pi/skills packages/pi/AGENTS.md"
          git diff --exit-code $PATHS || {
            echo "ERROR: Generated Pi artifacts are stale. Run 'npm run generate:pi' and commit the results."
            echo ""
            echo "Changed files:"
            git diff --name-only $PATHS
            exit 1
          }
          echo "Pi generated output is up to date."
