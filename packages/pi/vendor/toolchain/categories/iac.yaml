category: iac
version: "1.0"

capabilities:
  iac.plan:
    description: Compute the infrastructure change plan without applying it.
    inputs: [workspace]
    outputs: [status, changes]
    required: true
    sideEffect: false

  iac.apply:
    description: Apply a previously computed infrastructure change plan.
    inputs: [workspace]
    outputs: [status]
    required: false
    sideEffect: true

  iac.destroy:
    description: Tear down previously applied infrastructure in a workspace.
    inputs: [workspace]
    outputs: [status]
    required: false
    sideEffect: true
