worktree: plain-git
tracker: beads
work-graph: auto
ci-local: act
review: coderabbit
lint: reviewdog
test-runner: default
e2e-quality: playwright
container-deploy: docker-kubectl
iac: terraform
platform-cloud: aws
package-runner: npm
