# Shipped default adapter for each of the 14 toolchain categories
# (TRD-2026-8d825f54 TRD-003, PRD REQ-009).
#
# `resolveCategory()` in packages/development/lib/toolchain/config.js falls back to this file
# when no project config, user config, env-compat input or detection signal selects a category's
# adapter.
host: github
