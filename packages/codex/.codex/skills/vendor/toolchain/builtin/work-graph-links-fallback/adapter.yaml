# adapter.yaml for the built-in `work-graph-links-fallback` adapter (TRD-027, PRD REQ-016,
# REQ-020, REQ-004; TRD interpretation I7: "work-graph is its own category with default
# `auto`: use the work-graph capabilities of the resolved tracker adapter when its manifest
# provides them; otherwise use the built-in `work-graph-links-fallback` adapter (tracker
# dependency links, then plan order stated as not dependency-aware)").
#
# This file lives in the DATA directory (packages/development/toolchain/, not lib/), matching
# every other toolchain module's convention for non-`.js` data (category contracts, schemas,
# toolchain.default.yaml) -- packages/pi's lib-bundler.ts vendors this whole directory
# recursively. The CODE that reads it is a flat module,
# packages/development/lib/toolchain/builtin/work-graph-links-fallback.js (not a
# subdirectory's index.js -- see that file's own header for why).
#
# This manifest is deliberately NOT discovered through the normal 3-tier `skills/` search
# (packages/development/lib/toolchain/adapters.js#loadAdapter) and its two capabilities are
# never spawned as a subprocess through packages/development/lib/toolchain/runner.js -- they
# are executed in-process by the module above
# (#loadBuiltinWorkGraphAdapter / #runWorkGraphCapability), which itself calls
# `tracker.list`/`tracker.show` THROUGH the runner against the resolved tracker adapter (see
# that module for the full rationale and the "module vs. call-site branching" design decision).
# The generic adapter-manifest-schema.json
# (packages/development/toolchain/schemas/adapter-manifest-schema.json) assumes every adapter
# spawns its own subprocess via a `binaries`/`allowlist`/capability `run[]` template; this
# adapter has none of that, so it is deliberately not shaped to satisfy that schema and is
# never run through `./validate.js#validateAdapterDir`.
adapter: work-graph-links-fallback
version: "1.0.0"
categories:
  - work-graph
contract:
  work-graph: "2.0"
# Listed for identity/display purposes (the module above reads this to report
# `categories`/`adapter` to `resolveAll`/`preflight`'s `requireCapabilities` gate) --
# `work-graph.graph-health` is
# deliberately absent: this fallback only implements `work-graph.ready`/`work-graph.plan`
# (TRD-027's own scope), so a caller that `--require`s `work-graph.graph-health` against this
# adapter correctly fails `UNAVAILABLE` (PRD AC-004-1) rather than silently succeeding.
capabilities:
  work-graph.ready: {}
  work-graph.plan: {}
