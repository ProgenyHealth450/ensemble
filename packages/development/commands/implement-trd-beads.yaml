metadata:
  name: ensemble:implement-trd-beads
  description: Implement TRD with beads project management — persistent bead hierarchy, dependency-aware execution via br/bv, and cross-session resumability
  version: 3.0.0
  lastUpdated: "2026-10-20"
  category: implementation
  output_path: ensemble/implement-trd-beads.md
  source: sunstone
  model: medium
  argument_hint: "[trd-path] [--plan] [--execute] [--branch=<name>] [--use-current-branch] [--status] [--reset-task TRD-XXX] [--list] [max parallel N] [--foreman] [<trd-path> <trd-path>... --workstream [--generate-only [--out <path>] [--allow-invalid]]]"
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task

parameters:
  - name: workstream
    type: boolean
    default: false
    description: |
      With two or more TRD paths, generate one normalized executable workstream TRD
      (node "$TRD_CLI" create-workstream-trd) and implement that single TRD. Without
      --workstream or --legacy-multi, two or more TRD paths HALT.
  - name: generate-only
    type: boolean
    default: false
    description: |
      Only with --workstream and two or more TRD paths (replaces the removed
      /ensemble:create-workstream-trd). Generate the workstream TRD, report, and EXIT before any
      br/git/branch/scaffold/commit/PR side effect. Accepts --out <path> and --allow-invalid.
      Cannot be combined with --plan, --execute, --status, --reset-task, --list, --branch or --use-current-branch.
  - name: foreman
    type: boolean
    default: false
    description: |
      Force non-interactive mode (INTERACTIVE=false) for Foreman orchestration. No HALT
      behavior changes: unresolved branch intent, unresolved PR backend and failed
      completion verification still HALT. When FOREMAN_ARTIFACT_PATH is set and non-empty,
      also write the phase report to that exact path (never alter it; unset is not an error).

mission:
  summary: |
    Parse a TRD, scaffold a beads hierarchy (epic -> stories -> tasks) in br, hand
    execution to /ensemble:beads-build, then run the phase quality gates, PR review
    gates, completion verification and epic closure. State lives in br beads, so a run
    resumes across sessions. This command owns closure: beads-build is always invoked
    with --defer-completion.

    Rules:
    - Never hand-parse a TRD; every parse/plan/status comes from `node "$TRD_CLI"` JSON.
    - bv is OPTIONAL: when installed it is the scheduler (only `--robot-*` flags, never bare `bv`); without it beads-build schedules from `br ready`. Never read .beads/*.jsonl to schedule.
    - Never stage broadly (no `git add -A`, no `git add .`, no commit with the -a flag). Stage beads only via `node "$TRD_CLI" beads-stage --match "[trd:<TRD_SLUG>"`.
    - PR_REVIEW_SKILL = `"$(git rev-parse --show-toplevel 2>/dev/null)/packages/development/skills/pr-review-cycle/SKILL.md"`; resolve it from the repo root so it works from any cwd. Every pr-review-cycle invocation below reads that file.
    - In every `br list --json` result the issue list is the parsed JSON if it is an array, otherwise its `.issues` array.
    - Scaffold work is delegated only to @beads-scaffold-specialist (never backend-developer); no product code is written during Scaffold.
    - Detail for branch intent, PR creation per backend, workstream mode (incl. generated-TRD contents) and resume/recovery lives in the `implement-trd-beads-reference` skill. Read only the section a step points at.

    Terminal states: HALT (error printed, nothing further runs), EXIT (early-exit mode
    finished), COMPLETE (epic closed, report printed).

workflow:
  phases:
    - name: Preflight
      order: 1
      steps:
        - order: 1
          title: Arguments and early exits
          description: |
            Parse $ARGUMENTS and apply the first matching rule.
          actions:
            - "`--plan` with `--execute`: print 'ERROR: --plan and --execute are mutually exclusive.' and EXIT. `--plan` sets PLAN_ONLY (scaffold, then stop); `--execute` sets EXECUTE_ONLY (skip scaffold, requires an existing epic)."
            - "`--generate-only` together with any of `--plan`, `--execute`, `--status`, `--reset-task`, `--list`, `--branch=<name>`, `--use-current-branch`: print 'ERROR: --generate-only only generates the workstream TRD and cannot be combined with --plan, --execute, --status, --reset-task, --list, --branch or --use-current-branch.' and HALT before any br/git/scaffold side effect."
            - "TRD paths are the `.md` arguments (excluding the value after `--out`). Two or more without `--workstream`/`--legacy-multi`: print 'ERROR: Multiple TRDs passed directly. Direct multi-TRD execution is deprecated because it can lose fidelity across parser/runtime merge boundaries. Run /ensemble:implement-trd-beads --workstream --generate-only <trd1> <trd2> ... then /ensemble:implement-trd-beads <generated-workstream-trd>, or rerun with --workstream to generate and implement in one step.' and HALT before any br/git/scaffold side effect. `--legacy-multi` handling is reference section 4."
            - "`--workstream` with two or more TRD paths: resolve TRD_CLI per the tool-path-resolution skill (unresolvable or no `node` -> print 'ERROR: Node.js and the TRD CLI (lib/trd-cli.js) are required to generate the workstream TRD.' and HALT), run `node \"$TRD_CLI\" create-workstream-trd <TRD_PATHS...>` (with `--generate-only`, also pass `--out <path>` and `--allow-invalid` if given), parse `{ok,path,workstreamSlug,sourceTrds,errors}`. `ok` false, non-zero exit or malformed JSON -> print every error and HALT (no file is written on validation failure unless `--allow-invalid` in generate-only mode). Without `--generate-only`, continue as a single-TRD run on `path`. Generated content and details: reference section 4."
            - "`--generate-only` without `--workstream` and two or more TRD paths (or with `--legacy-multi`): print 'ERROR: --generate-only requires --workstream and two or more TRD paths.' and HALT."
            - "`--generate-only` after successful generation: print the generated path, the workstream slug, the source TRD count and the next step `/ensemble:implement-trd-beads <generated-path>`, then EXIT here: no later Preflight step runs, nothing is implemented, and no beads, branches, commits or PRs are created."
            - "`--list`: `node \"$TRD_CLI\" list --type trd` -> `{ok,items}`; print a table (ID/Name, Status, Score, Last Modified), ask via AskUserQuestion `id=trd_select` which to implement, and resolve `docs/TRD/<file>.md` by slug suffix/prefix match (unresolvable -> HALT)."
            - "`--status`: single TRD: `node \"$TRD_CLI\" status <TRD_SLUG>` and print `completion_pct` and `bead_counts`; EXIT. Workstream form: reference section 4."
            - "`--reset-task TRD-XXX`: reference section 5; EXIT."
            - "`--branch=<name>` -> BRANCH_REQUESTED; `--use-current-branch` -> USE_CURRENT_BRANCH_REQUESTED; both together HALT before any br/git/scaffold side effect."
            - "`max parallel N` / `--max-parallel N` -> MAX_PARALLEL; else TRD frontmatter `max_parallel`; else 3."
        - order: 2
          title: Tools
          description: Verify tooling before touching anything.
          actions:
            - "`br` must exist and `br list --status=open` must succeed, else HALT with the install URL https://github.com/Dicklesworthstone/beads_rust. `bv` absent -> BV_AVAILABLE=false: warn and continue (https://github.com/Dicklesworthstone/beads_viewer)."
            - "Resolve TRD_CLI (`packages/development/lib/trd-cli.js`) per the tool-path-resolution skill (`packages/development/skills/tool-path-resolution/SKILL.md`); unresolvable or no `node` -> HALT."
            - "Unless PLAN_ONLY: `beads-build-wave` must be among the Task tool's accepted subagent types (a file on disk does not prove registration). If not: print 'ERROR: agent beads-build-wave is not registered in this session. The installed ensemble-development plugin is out of date or was loaded before this agent shipped. Run /ensemble:reinstall-plugins, start a new session, and re-run.' and exit 1 before any bead is created."
        - order: 3
          title: Git-town, PR backend and working tree
          description: Resolve BRANCHING_STRATEGY, PR_BACKEND, INTERACTIVE and WORKTREE_STATUS. Procedure is reference section 1.
          actions:
            - "Follow reference section 1. Exit codes 3/4 from validate-git-town.sh and `branchingStrategy.action=='halt'` HALT; an unresolvable PR backend asks (interactive) or HALTs with the `ENSEMBLE_PR_BACKEND=<ado|manual|gh>` options (non-interactive)."
        - order: 4
          title: TRD selection and validation
          description: Locate the TRD and validate it before any side effect.
          actions:
            - "TRD_FILE_PATH priority: `.md` argument -> name search in `docs/TRD/` -> the single in-progress TRD in `docs/TRD/` -> ask. It must exist, contain `## Master Task List` and at least one `- [ ] **TRD-` entry."
            - "TRD_SLUG = filename lowercased, non-alphanumerics -> `-`, trimmed of leading/trailing `-`. TRD_LABEL = TRD_SLUG: the label every scaffolded bead carries and bv scopes by (not the TRD's display-only frontmatter Label)."
            - "Design readiness (frontmatter `design_readiness_score`): >= 4.0 pass; 3.0-3.99 warn and ask to continue (non-interactive: continue); < 3.0 HALT suggesting /ensemble:refine-trd; absent: note and continue."
            - "Traceability: run `node \"$TRD_CLI\" validate \"<TRD_FILE_PATH>\"`. `error` key -> HALT. Print `errors`, `warnings` and `skipped`. `ok:false` -> HALT ('Fix orphaned [satisfies] annotations ... run /ensemble:validate-requirements for details'); warnings alone continue. No beads or git changes have been made at this point."
        - order: 5
          title: Resume detection, staleness gate, strategy
          description: Decide fresh run vs resume, then gate on staleness and pick the strategy.
          actions:
            - "Search `br list --status=open --json` for an epic titled `[trd:<TRD_SLUG>]`. Found -> IS_RESUME=true, ROOT_EPIC_ID=its id, `br sync --flush-only`, print `node \"$TRD_CLI\" status <TRD_SLUG>` progress. Clean-tree gate (WORKTREE_STATUS from step 3): fresh run + dirty tree HALTs; resume + dirty tree notes it and continues. Details and EXECUTE_ONLY handling: reference section 5."
            - "Fresh run only: run the staleness-gate skill (`packages/development/skills/staleness-gate/SKILL.md`, resolved per tool-path-resolution) with TRD_PATH and IS_RESUME=false. Skip it on resume."
            - "STRATEGY: `strategy=X` argument -> TRD explicit -> constitution -> auto-detect (legacy/brownfield -> characterization, bug fix -> bug-fix, refactor/tech debt -> refactor, prototype/spike -> test-after) -> tdd."
        - order: 6
          title: Branch intent and feature branch
          description: Resolve the target branch and PR topology before the first git mutation. Procedure is reference section 2.
          actions:
            - "Follow reference section 2 (choices-read, pr-plan, intent resolution, reuse-mode PR_ACTIONS rewrite, checkout, choices-write). Produces STACKED_PRS, PR_ACTIONS, CURRENT_PHASE_BRANCH, PHASE_BRANCH_MAP, PHASE_PR_MAP. Runs on every invocation, including resumes."
        - order: 7
          title: Team roster and agent aliases
          description: Establish TEAM_ROLES and AGENT_ALIAS_MAP for delegation.
          actions:
            - "TEAM_ROLES: the TRD's explicit `team:` block if present, else `resolveDefaultTeamRoles` from `packages/development/lib/team-defaults.js` (always-on 8-role roster; no single-agent mode). Log one line `Team mode (default roster|TRD roster): lead=..., architect=..., builders=<n>, reviewer=..., qa=..., advisor=..., pm=..., documentation=...`."
            - "AGENT_ALIAS_MAP maps each unqualified agent name to its runtime id `<plugin>:<name>` (e.g. `backend-developer` -> `ensemble-full:backend-developer`). Build it from `packages/*/agents/*.yaml` plus the runtime agents `~/.omp/plugins/node_modules/@*/*/agents/*.md` and `~/.omp/plugins/node_modules/*/agents/*.md`; an exact unqualified entry wins over an alias. beads-build resolves the wave-runner through it. Never pass a bare name to Task() when only the namespaced form is accepted; a missing alias HALTs."

    - name: Scaffold
      order: 2
      steps:
        - order: 1
          title: Plan and create beads
          description: Skipped when IS_RESUME or EXECUTE_ONLY. The scaffold-plan PLAN is authoritative; execute it, never re-derive titles, descriptions or edges.
          actions:
            - "`node \"$TRD_CLI\" parse \"<TRD_FILE_PATH>\"` -> `trd` (title, slug, prFormat, phases[{n,title,shippableState,taskIds}], tasksById, warnings). Print warnings. `ok:false`/non-zero -> HALT."
            - "`node \"$TRD_CLI\" scaffold-plan \"<TRD_FILE_PATH>\"` -> `{ok, slug, plan}`; failure -> HALT. Print `plan.warnings`."
            - "Cache existing beads once: `br list --status=open --json`, keyed by title prefix (`[trd:<slug>]`, `[trd:<slug>:pr:<N>]` or `[trd:<slug>:phase:<N>]`, `[trd:<slug>:task:<ID>]`). Never re-query per bead."
            - "Create in order `plan.epic`, `plan.stories[]`, `plan.tasks[]`, `plan.synthesizedTests[]`. Skip any entry whose titlePrefix is cached (use the cached id). Otherwise `br create --title='<title>' --type=<type> --priority=<priority> --labels=<labels comma-joined> --description='<description>' --json` with the entry's fields verbatim and capture `.id`. HALT on any failure or empty id. Record ROOT_EPIC_ID, story ids by phase, TRD_TO_BEAD_MAP[task id], PHASE_TASK_IDS[phaseN]."
            - "Then wire `plan.deps` once: each `{type, blockerId, blockedId}` has title-prefix endpoints (`[trd:<slug>]` -> epic, `...:pr:<n>`/`...:phase:<n>` -> story, `...:task:<id>` -> task bead); run `br dep add <blocked_bead_id> <blocker_bead_id>`. Existing edges are a no-op; warn and skip unresolvable ones. Also remove stale inter-phase edges from older scaffolds (reference section 5)."
            - "`br sync --flush-only`. Print epic id and story/task/dep counts."
            - "Test task beads (`isTest`) carry their `Test AC:` scenarios in the description. For BDD scenarios the specialist that implements the bead resolves REQNROLL_CLI (`packages/product/lib/reqnroll-cli.js`), runs `generate-bindings <PRD_PATH> --out tests --sut <SUT_CSPROJ> --json`, confirms RED, delegates to reqnroll-binding-specialist (`packages/reqnroll/skills/reqnroll/SKILL.md`), and re-confirms RED before the paired implementation bead goes GREEN."
        - order: 2
          title: BV analysis and handoff
          description: Optional graph planning, optional Foreman tagging, then stop if PLAN_ONLY.
          actions:
            - "If BV_AVAILABLE: `bv --robot-plan --format toon` (parallel tracks), `bv --robot-insights --format toon` and `bv --robot-triage --format toon`; print tracks, top recommendations, quick wins, blockers. A bv failure (non-zero or malformed output) warns and sets BV_AVAILABLE=false. Insights reporting cycles HALT before execution until fixed (or /ensemble:refine-beads); reporting unexpected blockers or priority/order mismatches asks continue / refine-beads / abort (non-interactive: continue)."
            - "`--foreman` only: tag task beads for dispatch per reference section 6."
            - "PLAN_ONLY: print 'Plan complete. Bead hierarchy created. Run /ensemble:implement-trd-beads --execute to begin implementation.' and EXIT. `/ensemble:beads-build <ROOT_EPIC_ID> --plan` regenerates the analysis anytime."

    - name: Execute
      order: 3
      steps:
        - order: 1
          title: Delegate to beads-build
          description: One execution engine. beads-build owns wave scheduling and the builder/review pipeline; this command owns everything after it.
          actions:
            - "TEAM_ROLES_JSON = compact JSON of TEAM_ROLES (deprecated `--builder` / frontmatter `builder_agent` fall back to a compatibility roster `{lead:{agents:['tech-lead-orchestrator'],owns:['planning','escalation']},builder:{agents:[<builder or 'tech-lead-orchestrator'>],owns:['implementation']},architect:{agents:['architect'],owns:['task-design']},documentation:{agents:['documentation-specialist'],owns:['pr-boundary-doc-maintenance']}}`). ROOT_EPIC_ID must be set, else HALT 'Cannot delegate to beads-build — ROOT_EPIC_ID missing.'"
            - "Backfill labels for scaffolds that predate them (bv ignores a label no bead carries and would return every bead): `node \"$TRD_CLI\" beads-label --label \"<TRD_LABEL>\" --match \"[trd:<TRD_SLUG>\"` -> `{ok,labeled,already}`; failure -> HALT."
            - "Invoke `/ensemble:beads-build <ROOT_EPIC_ID> --trd <TRD_FILE_PATH> --max-parallel <MAX_PARALLEL> --team-roles '<TEAM_ROLES_JSON>' --label <TRD_LABEL> --defer-completion`. Environments without slash dispatch (Pi/OMP) call the `ensemble-beads-build` skill with `--epic <ROOT_EPIC_ID>` in place of the positional id and the same flags."
            - "Non-zero exit: print its output as a Debug Loop entry and HALT. Zero: read its summary (bead counts, branch state, last task closed). `--defer-completion` makes it skip epic closure and TRD checkbox sync; both run here after the gates. A blocked wave is handled per reference section 5."
            - "bv triage counts are global across all epics; never present them as this TRD's progress."

    - name: Quality Gate
      order: 4
      steps:
        - order: 1
          title: Per-phase gate
          description: |
            After execution, process phases in order. A phase is done when `phase-status` reports it complete. Resume here after a blocked review.
          actions:
            - "Closed task ids = TRD task ids whose beads are closed (from `br list --all --limit 0 --json` titles `[trd:<slug>:task:<id>]`). `node \"$TRD_CLI\" phase-status \"<TRD_FILE_PATH>\" --closed \"<comma-joined ids>\"` -> `{ok,currentPhase,phases:[{n,complete}],phaseTaskIds}`. On failure treat the phase as not complete this cycle. Run the gate below for each complete, not-yet-closed phase N (story = its story bead)."
            - "Tests: delegate to @test-runner (resolved via AGENT_ALIAS_MAP): full unit + integration suite for this phase's files; report pass/fail, unit and integration coverage, failures with file:line. `gate_passed = tests pass AND coverage >= target`; for strategy characterization or flexible it is informational (always passes)."
            - "Record: `br comment add <STORY_BEAD_ID> 'Quality gate result: <PASS|FAIL> | unit: <X%> | integration: <Y%> | strategy: <strategy>'`, `br sync --flush-only`. Not passed under tdd/refactor/bug-fix: print failures and pause for the user (fix / skip / abort)."
            - "GATE_ACTION = PR_ACTIONS[N]. If `GATE_ACTION.createPr == false` (single-PR mode): `br close <STORY_BEAD_ID> --reason='<bead_label> <N> complete - quality gate passed'`, `br sync --flush-only`, `node \"$TRD_CLI\" beads-stage --match \"[trd:<TRD_SLUG>\"`, `git commit -m 'chore(<bead_prefix> <N>): checkpoint (tests pass; unit <X%>, int <Y%>)'`; continue to the next phase on the single branch."
            - "If `GATE_ACTION.createPr == true` (stacked): do NOT close the story yet. (1) Pre-PR test gate `npm run test --workspaces --if-present`; non-zero -> HALT 'Local tests failed — PR creation blocked.' (2) On `GATE_ACTION.branch`, `PARENT_PHASE_TIP_SHA=$(git merge-base HEAD <GATE_ACTION.parentBranch>)`; invoke the pr-review-cycle skill (PR_REVIEW_SKILL) with MODE='local', BASE_SHA=<PARENT_PHASE_TIP_SHA>, HEAD_SHA=<git rev-parse HEAD>, PR_ID='<TRD_SLUG>-phase-<N>', TEST_COMMAND='npm run test --workspaces --if-present', FOREMAN=<true if --foreman or INTERACTIVE=false>. (3) It returns `{status, localPhase, reasons, reportPath}`. Only `localPhase=='LOCAL_REVIEW_COMPLETE'` passes; anything else is LOCAL_REVIEW_BLOCKED. Record `br comment add <STORY_BEAD_ID> 'PR review gate: <result> | report: <reportPath>'`. BLOCKED -> print the reasons and report path and HALT with the story still open, no PR and no branch append. COMPLETE -> close the story (reason '... quality gate and PR review gate passed'), sync, beads-stage, checkpoint commit (`... local review complete`), then create the PR and append the next branch per reference section 3."

    - name: Completion
      order: 5
      steps:
        - order: 1
          title: Completion verification
          description: Sole authority for task inventory, requirements and tests. Runs before any epic closure or completion message.
          actions:
            - "Invoke the completion-verification skill (`\"$(git rev-parse --show-toplevel 2>/dev/null)/packages/development/skills/completion-verification/SKILL.md\"`) with TRD_FILE_PATH, TRD_SLUG, TRACKING_MODE='beads', ROOT_EPIC_ID, TRD_TO_BEAD_MAP. It returns `{verdict, gapCount, reportPath}`."
            - "`INCOMPLETE`: print 'COMPLETION VERIFICATION FAILED: <gapCount> gap(s) found. Report: <reportPath>'. Interactive: ask 'Proceed anyway (override)' / 'Stop — fix gaps first'; only an explicit override sets COMPLETION_OVERRIDDEN. Otherwise (including non-interactive) HALT before Epic Closure: do not close the epic, sync checkboxes or print completion messaging."
            - "`COMPLETE`: print 'Completion verification: PASSED (0 gaps). Report: <reportPath>' and continue."
        - order: 2
          title: PR review completion check
          description: Whole-branch local review in single-PR mode; remote review status is informational only.
          actions:
            - "COMPLETION_ACTION = the `PR_ACTIONS` entry with `kind=='completion'`. Skip the local gate ONLY when COMPLETION_ACTION exists and `createPr` is exactly false (stacked mode; each phase already passed its gate). A missing entry or any other `createPr` value is treated as LOCAL_REVIEW_BLOCKED, never skipped."
            - "Single-PR local gate: COMPLETION_BASE_SHA = `git merge-base HEAD <default branch>` (default = `git symbolic-ref --short refs/remotes/origin/HEAD` minus `origin/`, fallback `main`); empty or unresolvable -> BLOCKED without calling the skill. Else invoke pr-review-cycle (PR_REVIEW_SKILL) with MODE='local', BASE_SHA=<COMPLETION_BASE_SHA>, HEAD_SHA=<git rev-parse HEAD>, PR_ID='<TRD_SLUG>-completion', TEST_COMMAND='npm run test --workspaces --if-present', FOREMAN as above. COMPLETION_LOCAL_REVIEW is 'LOCAL_REVIEW_COMPLETE' only when `localPhase=='LOCAL_REVIEW_COMPLETE'`; any other, missing or unparseable result is BLOCKED -> print 'PR REVIEW GATE BLOCKED for the completion PR: <reasons>. Report: <reportPath>.' and HALT before Epic Closure (epic open, no completion PR, a later re-run reviews fresh)."
            - "Remote status (never HALTs, never blocks closure): for each stacked phase with `PHASE_PR_MAP[N]` set, invoke pr-review-cycle with MODE='remote', PR_ID='<TRD_SLUG>-phase-<N>', PR_URL, HEAD_SHA=<head of that branch>, BOT_LOGINS=<configured review bots>, FOREMAN as above. `PR_REVIEW_STATUS[N]` = the returned `status` if exactly REVIEW_COMPLETE / REVIEW_PENDING / REVIEW_BLOCKED, else REVIEW_PENDING. Phases whose PR was never created (manual backend, ado without MCP) are 'PENDING (no PR created)'. Never call a PR merged or landed; only a human confirming the merge does. Single-PR mode has no remote PR yet; the report marks it REVIEW_PENDING at creation."
        - order: 3
          title: Epic closure and TRD checkboxes
          description: Close the epic only after verification and review gates held.
          actions:
            - "Proceed only if (verdict COMPLETE, or INCOMPLETE with COMPLETION_OVERRIDDEN) AND (COMPLETION_ACTION.createPr is exactly false, or COMPLETION_LOCAL_REVIEW == 'LOCAL_REVIEW_COMPLETE')."
            - "No open task or story bead for this TRD may remain: list open beads with `[trd:<TRD_SLUG>:task:` / `[trd:<TRD_SLUG>:story:` titles; a listing that fails or cannot be parsed counts as 'open beads remain'. If any, investigate instead of closing."
            - "`br close <ROOT_EPIC_ID> --reason='TRD implementation complete'`, `br sync --flush-only`."
            - "Sync the TRD: for each Master Task List task whose bead is closed, change `- [ ] **<id>**` to `- [x] **<id>**`; then `git add <TRD_FILE_PATH>`, `node \"$TRD_CLI\" beads-stage --match \"[trd:<TRD_SLUG>\"`, `git commit -m 'docs(TRD): sync checkboxes to bead closure state'`."
        - order: 4
          title: Completion report
          description: Final summary, completion PR (single-PR mode) and next steps.
          actions:
            - "Print TRD file, branch, strategy, epic id, `node \"$TRD_CLI\" status <TRD_SLUG>` progress, and the authoritative completion report path. Requirement table: write `br list --all --limit 0 --json` to a temp file and run `node \"$TRD_CLI\" req-status \"<TRD_FILE_PATH>\" --issues-json <file> --verified <REQ ids from req-verified:REQ-NNN tokens in the output of br comment list <ROOT_EPIC_ID>>`; if the comments cannot be read, print a warning and omit verified ids. Print SATISFIED / NOT VERIFIED per requirement and a total."
            - "Single-PR mode (`COMPLETION_ACTION.createPr == true`): the whole-branch review already passed in step 2; do not re-run it. Pre-PR test gate `npm run test --workspaces --if-present` (non-zero -> HALT). Create the PR per `PR_BACKEND` using COMPLETION_ACTION (base = default branch, body `Implements TRD <TRD_SLUG>. Strategy: <strategy>. <phase_count> phases, <task_count> tasks — all complete. Bead: <ROOT_EPIC_ID>.`; reference section 3). Print a PR SUMMARY with the URL and 'Review: REVIEW_PENDING (head-bound remote review has not run; re-invoke pr-review-cycle MODE=remote for PR_ID <TRD_SLUG>-completion)', or, if no PR was auto-created, 'PR: not auto-created' and 'Review: PENDING (no PR created)'."
            - "Stacked mode (`STACKED_PRS=true`): print a STACKED PR SUMMARY, one line per `PHASE_BRANCH_MAP` entry: `<PR|Phase> <N>: <url or 'not auto-created — see manual instructions printed at that phase gate'> (branch -> parent) -- review: <PR_REVIEW_STATUS[N]>`, plus `Shippable: <state>` when PR_FORMAT is true. Say to merge PR 1 first (it targets the default branch); git-town auto-retargets the rest, plain-git needs manual retargeting."
            - "Remind user: after all PRs merge run `mv <trd_file> docs/TRD/completed/`. Beads-backed quickstart.md generation is unsupported."
            - "Remind user: br sync --flush-only && node \"$TRD_CLI\" beads-stage --match \"[trd:<TRD_SLUG>\" && git commit -m 'chore: final beads sync'"

expectedInput:
  format: Technical Requirements Document (TRD) with a Master Task List

expectedOutput:
  structure:
    - name: Workstream TRD (--workstream --generate-only)
      description: Generated workstream TRD under docs/TRD/workstreams/ (or the --out path); no beads, branches, commits or PRs are created
  format: Beads hierarchy in br, feature branch(es) and PR(s), closed beads with quality-gate comments, TRD checkboxes synced, completion verification report and requirement satisfaction report
