metadata:
  name: ensemble:beads-build
  description: Drive an existing bead hierarchy to completion through the full builder, code-review, and close pipeline
  version: 1.3.0
  lastUpdated: "2026-10-21"
  category: implementation
  output_path: ensemble/beads-build.md
  source: sunstone
  model: medium
  argument_hint: "[epic-id|slug-pattern | --epic <id>] [--max-parallel N | max parallel N] [--trd trd-path] [--strategy tdd|characterization|bug-fix|refactor|test-after|flexible] [--label <label>] [--defer-completion] [--plan]"
  allowed_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - Task

mission:
  summary: |
    Drive an existing bead hierarchy (epic -> stories -> tasks) to completion through
    the full builder -> code-review -> close pipeline. This is the canonical build
    engine — works for raw beads with no TRD required. implement-trd-beads and
    implement-bead delegate to it; --plan prints the analysis without executing.
    Loop: the parent (this command) checks bead-graph state and dispatches a fresh
    Task(subagent_type=beads-build-wave, prompt=...) per wave. The wave-runner agent
    runs ONE wave (plan + concurrent Task() track dispatch + barrier) and emits a JSON
    summary line; the parent decides on remaining_scoped_count whether to dispatch
    another. No recursion (Codex max_depth=1): wave-runners are depth-1 subagents.

    Scheduler: bv --robot-plan when bv is installed, else br ready. Each wave partitions the ready set
    into parallel tracks (up to --max-parallel; default 3) and dispatches each track
    concurrently to a tech-lead-orchestrator Bead-Track subagent. A barrier sits
    between waves: every track must complete before the next bv call. Records all
    state transitions in beads for cross-session resumability. When --trd is
    provided, enables TRD augmentations: traceability tokens, TRD checkbox sync,
    and requirement satisfaction report.

    Key behaviors:
    - Each wave is a barrier: dispatch all tracks, wait for every track, then re-plan.
    - The parent loop body is mechanical: read count, dispatch wave-runner, read
      JSON summary, repeat. No narrative reasoning happens between iterations.
    - Quality gates: phase completion triggers test delegation; results recorded as br comments
    - Sync: br sync --flush-only before every bv call
    - bv is OPTIONAL. With bv, the wave-runner schedules from bv --robot-plan (graph-aware parallel tracks); without it, from br ready (one single-bead track per ready bead, up to --max-parallel). Never read .beads/*.jsonl to schedule.
    - TRD mode: optional --trd flag enables traceability tokens, checkbox sync, requirement report

workflow:
  phases:
    - name: Preflight
      order: 1
      steps:
        - order: 1
          title: Argument Parsing
          description: Parse epic-id or slug pattern (positional or --epic), --max-parallel (or free-text max parallel N), --trd path, --strategy, --team-roles, deprecated --builder, and --defer-completion
          actions:
            - 'Parse $ARGUMENTS: if --epic <value> is present, RAW_INPUT=<value>; otherwise take the first token as RAW_INPUT (no epic argument if it is absent or starts with "--"). Run br show <RAW_INPUT> --json: exit code 0 means it is an existing bead of ANY id prefix (beads-12, cribs-l4pd, ...), so treat it as the direct epic bead ID (EPIC_ID_MODE=true); a non-zero exit means it is not a bead id, so treat it as a slug pattern (EPIC_ID_MODE=false). Never infer this from how the token is spelled.'
            - 'Parse --trd <path> from $ARGUMENTS (optional); if present set TRD_MODE=true and TRD_PATH=<path>; if absent set TRD_MODE=false'
            - 'Parse --strategy <value> from $ARGUMENTS (optional); valid values: tdd, characterization, bug-fix, refactor, test-after, flexible'
            - 'Parse --label <L> from $ARGUMENTS (optional); if present set LABEL=<L>. LABEL scopes bv plans and scoped bead counts to one TRD; Epic Discovery resolves and verifies it.'
            - 'Parse --team-roles <json> from $ARGUMENTS (optional); if present parse as TEAM_ROLES object. If absent, parse deprecated --builder <agent> and synthesize compatibility TEAM_ROLES={lead:{agents:[\"tech-lead-orchestrator\"],owns:[\"planning\",\"escalation\"]},builder:{agents:[<builder>],owns:[\"implementation\"]},architect:{agents:[\"architect\"],owns:[\"task-design\"]},documentation:{agents:[\"documentation-specialist\"],owns:[\"pr-boundary-doc-maintenance\"]}}. If neither flag is present, set TEAM_ROLES={} and continue — standalone beads-build may still run without team metadata.'
            - 'Parse --max-parallel <N> from $ARGUMENTS; if absent, also accept the free-text form "max parallel N" (e.g., "max parallel 3"). Set MAX_PARALLEL=N; default MAX_PARALLEL=3 if neither is present'
            - 'Parse --defer-completion from $ARGUMENTS (optional flag, no value): if present set DEFER_COMPLETION=true, else DEFER_COMPLETION=false. A caller that owns completion verification and epic closure (implement-trd-beads) passes it; standalone invocations leave it unset.'
            - 'Parse --plan from $ARGUMENTS (optional flag, no value): if present set PLAN_ONLY=true, else PLAN_ONLY=false. Plan mode prints bv/br analysis for the epic and never mutates beads, git or files.'

        - order: 2
          title: Tool Availability Check
          description: Verify br is installed and detect bv availability
          actions:
            - '"which br || { echo ''ERROR: br (beads_rust) not installed. Install from https://github.com/Dicklesworthstone/beads_rust''; exit 1; }"'
            - '"br list --status=open > /dev/null 2>&1 || { echo ''ERROR: br not functional''; exit 1; }"'
            - '"which bv && BV_AVAILABLE=true || { echo ''WARNING: bv (beads_viewer) not installed. Graph-aware triage will be unavailable. Install from https://github.com/Dicklesworthstone/beads_viewer''; BV_AVAILABLE=false; }"'
            - 'If PLAN_ONLY=true: skip the wave-runner check below and Preflight steps 3-7, skip the Execute, Quality Gate and Completion phases, run only the Plan Mode phase and exit (bv is still optional there).'
            - 'Verify the wave-runner agent is registered in this session (skip when PLAN_ONLY=true). The Execute phase dispatches Task(subagent_type=beads-build-wave), so beads-build-wave (listed as ensemble-development:beads-build-wave) must be among the subagent types the Task tool currently accepts. An agent file on disk, or an entry in AGENT_ALIAS_MAP, does not prove the plugin registered it. If it is not available: print "ERROR: agent beads-build-wave is not registered in this session, so the wave loop cannot dispatch. The installed ensemble-development plugin is out of date or was loaded before this agent shipped. Run /ensemble:reinstall-plugins, start a new Claude Code session, and re-run." and HALT before any bead is read or changed.'

        - order: 3
          title: Git-Town and Working Directory Verification
          description: Verify git-town is installed and the working directory is clean; resolve branching strategy and PR backend via resolve-sdlc
          actions:
            - 'Resolve VALIDATE_GIT_TOWN_SH (RELATIVE_PATH packages/git/skills/git-town/scripts/validate-git-town.sh) and TRD_CLI (RELATIVE_PATH packages/development/lib/trd-cli.js) with the tool-path-resolution skill (skills/tool-path-resolution/SKILL.md). If a path does not resolve print "ERROR: could not locate <tool>" and HALT.'
            - 'Run: bash "$VALIDATE_GIT_TOWN_SH"; capture its exit code as GIT_TOWN_EXIT_CODE (0-4). Exit codes 3 (version mismatch) and 4 (not a git repo) are unaffected by this feature — HALT on those exactly as before. Exit codes 0 (ok), 1 (not installed), and 2 (not configured) no longer HALT here — they are passed to resolve-sdlc below.'
            - 'Detect AskUserQuestion availability: INTERACTIVE=true if available, else false.'
            - 'Run: REMOTE_URL=$(git remote get-url origin 2>/dev/null); if REMOTE_URL is empty (no origin configured), set REMOTE_URL to the literal string ''none'' — resolve-sdlc requires a non-empty --remote-url, and any non-URL string is treated as ''no unsupported host detected''.'
            - 'Run: node "$TRD_CLI" resolve-sdlc --git-town-exit-code "$GIT_TOWN_EXIT_CODE" --remote-url "$REMOTE_URL"; parse the single JSON object from stdout as RESOLVE_SDLC_RESULT.'
            - 'If RESOLVE_SDLC_RESULT has an ''error'' key (trd-cli.js''s shared failure contract — a thrown Error caught by main(), printed as {"error":"<msg>"} with exit 1; NOT {ok:false,error:...}): print the error and HALT. This should not normally happen since GIT_TOWN_EXIT_CODE and REMOTE_URL are always well-formed here, but never swallow it.'
            - 'If RESOLVE_SDLC_RESULT.branchingStrategy.action == ''halt'': print RESOLVE_SDLC_RESULT.branchingStrategy.message and HALT.'
            - 'If RESOLVE_SDLC_RESULT.prBackend.needsResolution == true: If INTERACTIVE=true, call AskUserQuestion with id=''pr_backend'', question=''This repository''''s remote is not supported by git-town''''s PR automation. How should pull requests be created?'', options=[{label:''ado'',description:''Use the azure-devops MCP tool to create the PR (falls back to printing manual az repos/portal steps if the MCP tool is not connected)'',preview:''ENSEMBLE_PR_BACKEND=ado''},{label:''manual'',description:''Always print manual PR-creation steps instead of automating PR creation'',preview:''ENSEMBLE_PR_BACKEND=manual''},{label:''proceed with gh anyway (not recommended)'',description:''Use the gh CLI even though the remote host is not GitHub — will likely fail'',preview:''ENSEMBLE_PR_BACKEND=gh''},{label:''abort'',description:''Stop without resolving a PR backend'',preview:''Abort''}], multi=false, recommended=0. Parse the answer: ''ado'' -> PR_BACKEND=ado; ''manual'' -> PR_BACKEND=manual; ''proceed with gh anyway (not recommended)'' -> PR_BACKEND=gh; ''abort'' -> print ''Aborted — no git side effects.'' and HALT. If INTERACTIVE=false, or INTERACTIVE detection is itself uncertain (always default to this branch when in doubt — never risk a hung prompt): print ''PR backend could not be auto-resolved for this repository''''s remote. Set one of the following to proceed non-interactively:'', then each of ''ENSEMBLE_PR_BACKEND=ado'', ''ENSEMBLE_PR_BACKEND=manual'', ''ENSEMBLE_PR_BACKEND=gh'' on its own line, then the persistence hint ''...set this in your shell profile/CI config to skip this prompt on future invocations.'', and HALT.'
            - 'If RESOLVE_SDLC_RESULT.prBackend.needsResolution == false: set PR_BACKEND=RESOLVE_SDLC_RESULT.prBackend.backend (no prompt, no HALT).'
            - 'Set BRANCHING_STRATEGY=RESOLVE_SDLC_RESULT.branchingStrategy.strategy. Both BRANCHING_STRATEGY and PR_BACKEND are re-resolved fresh on every invocation, including resumed epics, and are read by later Preflight/Execute/Quality-Gate/Completion steps in this file — never cached across sessions.'
            - 'If RESOLVE_SDLC_RESULT.consolidatedMessage is non-null: print it. If it is null (the pure-default case — git-town configured and remote is GitHub): print nothing new at all, matching today''s exact output for existing git-town+GitHub users.'
            - 'This command never creates or switches branches (the caller or user owns that), so it issues no git town command under any BRANCHING_STRATEGY.'
            - 'Run: git status --porcelain -- . '':(exclude).beads'' and capture the output as WORKTREE_STATUS. Do NOT decide on it here: the clean-tree gate runs in Epic Discovery (Preflight step 4), because a dirty tree is only a fault on a fresh run, not a resume. .beads/ is br''s own state (see docs/guides/beads-tracked-export.md).'

        - order: 4
          title: Epic Discovery
          description: Locate the root epic bead using the provided ID or slug pattern, detect cross-session resume
          actions:
            - 'If EPIC_ID_MODE=true: run br show <RAW_INPUT> to confirm epic exists; if exit code != 0 print "ERROR: Bead <RAW_INPUT> not found." and HALT; store ROOT_EPIC_ID=RAW_INPUT; derive EPIC_SLUG from bead title'
            - 'If EPIC_ID_MODE=false: run br list --status=open --json; the issue list is the parsed JSON if it is an array, otherwise its `.issues` array (br 0.2.x wraps list output as {issues:[...]}); scan .title fields for entries containing RAW_INPUT as substring (case-insensitive); collect matches'
            - 'If zero matches found: print "ERROR: No open epic found matching slug pattern ''<RAW_INPUT>''." and HALT'
            - 'If multiple matches found: print "ERROR: Multiple epics match ''<RAW_INPUT>'':" followed by each matching title; HALT'
            - 'If exactly one match: store ROOT_EPIC_ID from .id field; derive EPIC_SLUG (lowercase, replace non-alphanumeric with hyphens, strip leading/trailing hyphens)'
            - 'Check for existing in-progress tasks: run br list --status=in_progress --json; take its issue list (the parsed JSON if it is an array, otherwise its `.issues` array); filter by EPIC_SLUG prefix; count IN_PROGRESS_COUNT'
            - 'If IN_PROGRESS_COUNT > 0: print "Resume detected: <IN_PROGRESS_COUNT> tasks already in_progress. Resuming from current state." and print bead IDs with their titles'
            - 'Count work already done under this epic: run br list --all --status=closed --limit 0 --json; filter by EPIC_SLUG prefix; count CLOSED_COUNT. Both flags are load-bearing and `br list --help` states why: -a/--all is "Include closed issues (default excludes closed)", so without it a closed-status query reads against a set closed issues were already removed from; and --limit is "Maximum number of results (0 = unlimited, default: 50)", so without --limit 0 this epic''s closed tasks fall outside the first 50 rows of any long-lived beads database and the client-side EPIC_SLUG filter sees none of them. Omitting either makes CLOSED_COUNT read 0, so the gate below HALTs a legitimate resume. Set STARTED_COUNT = IN_PROGRESS_COUNT + CLOSED_COUNT. IN_PROGRESS_COUNT alone is not the resume signal: between two waves every task of the finished wave is closed and none is in_progress yet, which is a resume that IN_PROGRESS_COUNT reads as a fresh run. The epic itself cannot carry the signal here the way ROOT_EPIC_ID does in implement-trd-beads, because this command HALTs above when the epic is absent, so by this line it always exists.'
            - 'Clean-tree gate (moved here from Preflight step 3). If STARTED_COUNT == 0 — nothing under this epic has been started or finished, so this is a fresh run — and WORKTREE_STATUS is non-empty: print "ERROR: working directory is dirty. Commit, stash or revert before starting a new build." followed by WORKTREE_STATUS, and HALT. A fresh run gets exactly the behaviour it had before. The gate sits before the LABEL backfill below (the first write in Preflight), so it still precedes every side effect.'
            - 'If STARTED_COUNT > 0 and WORKTREE_STATUS is non-empty: print "NOTE: resuming with a dirty working directory. These paths are carried into the resumed build and nothing here commits, stashes or reverts them:" followed by WORKTREE_STATUS, then continue. A resumed build is re-entering work that was already modifying the tree, so a dirty tree is the expected state rather than a fault. Never stash, commit, checkout or clean these paths to satisfy a gate.'
            - 'Resolve LABEL: if LABEL is unset, run br show <ROOT_EPIC_ID> --json (it prints a one-element array; use the element) and, if its .labels has exactly one entry, set LABEL to it. Otherwise leave LABEL unset: scoping then falls back to the EPIC_SLUG title match, as before.'
            - 'If LABEL is set and the root epic title starts with [trd:<slug>] (a TRD-generated epic): backfill with node "$TRD_CLI" beads-label --label "<LABEL>" --match "[trd:<slug>" (TRD_CLI is resolved in Preflight step 3). If it fails, print the error and HALT. This labels beads scaffolded before labels existed and is a no-op otherwise.'
            - 'If LABEL is set: LABEL_IDS = the .id of every entry in the issue list of br list --all --label <LABEL> --json. If LABEL_IDS is empty: print "ERROR: no bead carries label <LABEL>. bv ignores an unknown label and would schedule every bead in the repo, so beads-build will not continue." and HALT.'
            - 'Resolve STAGE_SCOPE (what to stage from a tracked .beads/issues.jsonl; see docs/guides/beads-tracked-export.md): if the root epic title starts with [trd:<slug>], STAGE_SCOPE=--match "[trd:<slug>"; otherwise, if LABEL is set, STAGE_SCOPE=--label <LABEL>; otherwise leave it unset and skip the beads-stage step wherever it appears below.'

        - order: 5
          title: TRD Augmentation Setup
          description: Validate TRD file and build traceability map when TRD_MODE is enabled
          actions:
            - 'If TRD_MODE=false: set TASK_TRACEABILITY={} (empty); skip remaining steps in this phase step; print "TRD augmentations: disabled (no --trd flag)"'
            - 'If TRD_MODE=true: verify TRD_PATH file exists on disk; if not found print "ERROR: TRD file not found at <TRD_PATH>" and HALT'
            - 'Read TRD file; parse YAML frontmatter block (between --- delimiters) for design_readiness_score field'
            - 'If score >= 4.0 (PASS): print "Design Readiness: PASS (<score>)" and continue'
            - 'If score >= 3.0 AND < 4.0 (CONCERNS): print "WARNING: TRD has Design Readiness score of <score> (CONCERNS). Consider running /ensemble:refine-trd before implementation."'
            - 'If score < 3.0 (FAIL): print "ERROR: TRD has Design Readiness score of <score> (FAIL). Run /ensemble:refine-trd to improve the TRD before implementation." and HALT'
            - 'If no design_readiness_score found: print "NOTE: No Design Readiness score found (pre-v3.0.0 TRD). Consider running /ensemble:refine-trd." and continue'
            - 'Build TASK_TRACEABILITY map: scan TRD for [satisfies REQ-NNN], [satisfies INFRA], [satisfies ARCH], [verifies TRD-NNN], "Validates PRD ACs:" fields, "Implementation AC:" blocks, "Proof of requirement:" fields per task; store in map keyed by task.id'
            - 'Classify task type: if task.id ends in -TEST suffix, mark is_test_task=true; extract verifies_task_id and satisfies_req_id; store in TASK_TRACEABILITY[task.id]'
            - 'Print "TRD augmentations: enabled (traceability, checkbox sync, requirement report)"'
            - 'Bead references: the wave track payload carries `context_contract` (claim -> `bead-context` read -> dispatch -> commit gate); an unresolvable bead is never implemented.'

        - order: 6
          title: TRD Staleness Gate
          description: |
            When TRD_MODE=true and first invocation, check TRD freshness before execution begins.
            Skip when TRD_MODE=false or when resuming an existing epic.
            Algorithm defined in packages/development/skills/staleness-gate/SKILL.md.
          actions:
            - 'If TRD_MODE=false: skip this step entirely. Print "Staleness check: skipped (no --trd flag)" and continue to step 7.'
            - 'If TRD_MODE=true AND ROOT_EPIC_ID was found in Preflight step 4 (Epic Discovery) — IS_RESUME=true: skip this step. Print "Staleness check: skipped (resume detected)" and continue to step 7.'
            - 'If TRD_MODE=true AND no ROOT_EPIC_ID found in step 4 (first invocation): execute the TRD Staleness Gate per packages/development/skills/staleness-gate/SKILL.md using TRD_PATH from Preflight step 1 and IS_RESUME=false.'
            - 'On HALT from skill: do not proceed. Implementation stops.'
            - 'On RETURN from skill: continue to step 7 (Strategy Detection).'

        - order: 7
          title: Strategy Detection
          description: Determine implementation strategy from arguments, TRD content, or auto-detection
          actions:
            - 'Priority: --strategy arg -> TRD explicit (if TRD_MODE) -> auto-detect from bead titles/descriptions -> default (tdd)'
            - 'Auto-detect: legacy/brownfield/untested -> characterization; bug fix/regression -> bug-fix; refactor/tech debt -> refactor; prototype/spike/POC -> test-after; default -> tdd'
            - 'Store STRATEGY; print "Strategy: <STRATEGY>"'


    - name: Execute
      order: 2
      steps:
        - order: 1
          title: Wave Loop (single-wave subagent dispatch)
          description: |
            Two-tier non-recursive dispatch loop (v1.2.0). Each iteration dispatches
            ONE wave-runner subagent via Task() and reads back a JSON summary. The
            loop body is mechanical: count + dispatch + read summary + decide.
            The wave-runner runs bv --robot-plan and concurrent Task() track dispatch;
            this parent does NOT call bv or Task(tech-lead-orchestrator) directly.
            Cross-platform: every runtime exposes Task(subagent_type, prompt). The
            depth-1 subagent respects Codex's max_depth=1 constraint.
          actions:
            - 'Run: br sync --flush-only (ensure JSONL is current before the loop reads state).'
            - 'Step 1 (initial state read; in every br list --json result below the issue list is the parsed JSON if it is an array, otherwise its `.issues` array): REMAINING_SCOPED_COUNT = count from br list --status=open --label <LABEL> --json when LABEL is set (exact), otherwise from br list --status=open --json filtered by EPIC_SLUG (entries whose .title contains EPIC_SLUG). IN_PROGRESS_SCOPED_COUNT = the same with --status=in_progress. If REMAINING_SCOPED_COUNT == 0 AND IN_PROGRESS_SCOPED_COUNT == 0: print "=== Execution completed: no remaining scoped work ===" and proceed to Quality Gate.'
            - 'Step 2 (loop body, single tool turn): in a single tool turn, dispatch Task(subagent_type=<resolved-from-AGENT_ALIAS_MAP-beads-build-wave>, prompt=<wave_payload>) where wave_payload = { ROOT_EPIC_ID, EPIC_SLUG, LABEL, MAX_PARALLEL, TRD_MODE, TRD_PATH, STRATEGY, TEAM_ROLES, wave_number }. Resolve the namespaced identifier through AGENT_ALIAS_MAP (built by implement-trd-beads.yaml Preflight step 12, or for standalone invocations by scanning packages/*/agents/*.yaml plus ~/.omp/plugins/node_modules/@*/*/agents/*.md). Never pass a bare "beads-build-wave" string.'
            - 'Step 3 (read summary): the subagent emits ONE JSON summary line at the end of stdout. Parse SUMMARY_JSON = { wave_number, tracks_dispatched, tracks_succeeded, tracks_failed, beads_closed_this_wave, remaining_scoped_count, in_progress_scoped_count, terminal_state, elapsed_seconds, next_action_hint }.'
            - 'Step 4 (decide, then continue or exit):'
            - '  - If SUMMARY_JSON.terminal_state == "complete": print "=== Execution completed: <beads_closed_this_wave> beads closed in final wave ===". Break the loop and proceed to Quality Gate.'
            - '  - If SUMMARY_JSON.terminal_state == "blocked": print "=== Execution blocked: <remaining_scoped_count> open scoped beads with no actionable tracks. ===" (when BV_AVAILABLE also run bv --robot-insights for graph details). HALT with "EXECUTION BLOCKED - manual intervention required".'
            - '  - If SUMMARY_JSON.terminal_state == "in_progress" AND SUMMARY_JSON.remaining_scoped_count > 0 AND SUMMARY_JSON.next_action_hint == "dispatch_another_wave": immediately return to Step 2 with wave_number = SUMMARY_JSON.wave_number + 1. Do NOT print progress, do NOT summarize, do NOT pause between iterations - the JSON summary is the only output between iterations.'
            - '  - If SUMMARY_JSON.terminal_state == "in_progress" AND SUMMARY_JSON.remaining_scoped_count == 0 AND SUMMARY_JSON.in_progress_scoped_count == 0: print "=== Execution completed: state drain reached zero ===". Break the loop and proceed to Quality Gate.'
            - 'Step 5 (no re-plan or re-partition at this layer): this command does NOT call bv --robot-plan. The wave-runner does. The next wave is a fresh Task() invocation - no state from a prior wave is reused.'
            - 'Step 6 (context budget monitoring, informational only): after every 5 waves, print "Context checkpoint: <N> waves completed this session. If quality is degrading, consider: (1) /compact to compress conversation context, (2) start a new session with /ensemble:beads-build <ROOT_EPIC_ID> (beads preserve all state)." Do not halt or pause execution based on this signal.'
            - 'After the loop exits: run br sync --flush-only. Print "=== Execution completed: <WAVE_COUNT> waves processed ===". Continue to Quality Gate.'
        - order: 2
          title: Debug Loop (TRD-019)
          description: Attempt automated fix on track failure via deep-debugger (max 2 retries). Sibling-track failures are isolated; only this track's beads are re-attempted.
          actions:
            - 'When a track fails with an actual error (crash/exception) and beads in that track remain unclosed:'
            - '  1. Delegate to @deep-debugger with error details, changed files, strategy, bead IDs in the failing track'
            - '  2. If fix applied: re-launch the track with the same payload (the fix propagates via the surviving bead graph); continue to next wave'
            - '  3. After 2 retries: br comment add <each_unclosed_bead> "Debug loop exhausted after 2 retries. Root cause: <error_analysis>. Attempted fixes: <fix_attempts>. Manual intervention required."; br sync --flush-only; PAUSE for user decision'
        - order: 3
          title: Error Handling
          description: Handle br command failures during execution
          actions:
            - 'After any br command: if exit code != 0 AND prior br commands in session succeeded -> possible br failure'
            - 'Print error message with br command that failed and its exit code'
            - 'Print: check br status and .beads/ directory integrity'
            - 'PAUSE for user decision (resume with /ensemble:beads-build <ROOT_EPIC_ID> after issue resolved)'

    - name: Quality Gate
      order: 3
      steps:
        - order: 1
          title: Phase Completion Detection
          description: Detect when all tasks in a phase are closed
          actions:
            - 'After each task completion: determine CURRENT_PHASE_N = the lowest-numbered phase/story with open tasks. Task beads carry NO phase prefix in their title — phase membership comes from the dependency children of the phase story bead (the task beads it blocks). Reconstruct the per-phase task id set from each STORY_BEAD_ID dependency children if not already tracked.'
            - 'Phase N is complete when every task bead that is a dependency child of STORY_BEAD_IDs[N] has status==closed. Do NOT filter by a phase:<N> title prefix — task beads have no such segment.'
            - 'If all tasks for phase N are closed: BEFORE triggering PR/reporting follow-up, run PR-boundary documentation maintenance using packages/development/lib/doc-maintenance.js. Fire once per PR boundary (or once at root-epic close for legacy TRDs with no PR headings). The hook may only touch README.md, AGENTS.md, and docs/UserGuide.md; if ENSEMBLE_SKIP_DOC_HOOK=1 or documentation-specialist is missing, log the corresponding INFO line and continue.'

        - order: 2
          title: Test Execution
          description: Delegate test suite execution to test-runner for the modified phase files
          actions:
            - 'When a phase completes (Quality Gate step 1 triggers): delegate to @test-runner with: run full test suite (unit + integration) for files modified in this phase; report pass/fail, unit coverage %, integration coverage %, failures with file:line'
            - 'gate_passed = tests_pass AND unit_cov >= target AND int_cov >= target'
            - 'Exception: strategy=characterization or flexible -> gate_passed = true (informational only)'
        - order: 3
          title: Gate Result Recording
          description: Record quality gate outcome as br comment and close story on pass
          actions:
            - 'Run: br comment add <STORY_BEAD_ID> "Quality gate result: <PASS|FAIL> | unit: <X%> | integration: <Y%> | strategy: <strategy>"'
            - 'Run: br sync --flush-only'
            - 'If gate_passed: br close <STORY_BEAD_ID> --reason=''Phase complete - quality gate passed''; br sync --flush-only; node "$TRD_CLI" beads-stage <STAGE_SCOPE> (stages only this epic''s beads from a tracked export; skip when STAGE_SCOPE is unset; never stage the whole .beads/ directory and never commit with -a); git commit -m "chore(phase <N>): checkpoint (tests pass; unit <X%>, int <Y%>)"'
            - 'If NOT gate_passed AND blocking strategy (tdd/refactor/bug-fix): print gate failure details; PAUSE for user: fix/skip/abort'

    - name: Completion
      order: 4
      steps:
        - order: 1
          title: Epic Closure
          description: Close the root epic when all children are done (skipped when DEFER_COMPLETION=true)
          actions:
            - 'If DEFER_COMPLETION=true: print "Epic closure: deferred to caller (--defer-completion)" and skip this step entirely; the caller closes the epic only after its own completion verification and PR gate.'
            - 'Verify: br list --status=open --label <LABEL> --json when LABEL is set, otherwise br list --status=open --json filtered by EPIC_SLUG (issue list = the parsed JSON if it is an array, otherwise its `.issues` array), returns no open tasks'
            - 'Run: br close <ROOT_EPIC_ID> --reason=''Epic implementation complete'''
            - 'Run: br sync --flush-only'

        - order: 2
          title: TRD Checkbox Sync
          description: Update TRD file checkboxes to reflect bead closure state (TRD_MODE only; skipped when DEFER_COMPLETION=true)
          actions:
            - 'If TRD_MODE=false: skip this step'
            - 'If DEFER_COMPLETION=true: print "TRD checkbox sync: deferred to caller (--defer-completion)" and skip this step; the caller syncs checkboxes after its own completion verification.'
            - 'If TRD_MODE=true: for each task in TRD Master Task List: if bead status == ''closed'' -> replace "- [ ] **<task.id>**" with "- [x] **<task.id>**"'
            - 'git add <TRD_PATH>; node "$TRD_CLI" beads-stage <STAGE_SCOPE> (skip when STAGE_SCOPE is unset); git commit -m "docs(TRD): sync checkboxes to bead closure state"'

        - order: 3
          title: Completion Report
          description: Print final summary, requirement satisfaction table (if TRD_MODE), and PR reminder
          actions:
            - 'Print completion report: EPIC_SLUG, branch, strategy, ROOT_EPIC_ID, task counts, coverage summary'
            - 'If TRD_MODE=true: print Requirement Satisfaction Table:'
            - '  Scan ROOT_EPIC_ID comments for req-verified: tokens: run br comment list <ROOT_EPIC_ID>'
            - '  If br comment list fails: print "WARNING: Could not read root epic comments — req-verified data unavailable." Continue with empty VERIFIED_REQS.'
            - '  Parse each comment for tokens: req-verified:REQ-NNN, by:TRD-NNN-TEST, qa:<agent>, reviewer:<agent>, ac-proven:AC-NNN-M,...'
            - '  Build VERIFIED_REQS map keyed by REQ-NNN, capturing the verifier and proven ACs from each comment'
            - '  Print table:'
            - '    === REQUIREMENT SATISFACTION REPORT ==='
            - '    REQ-001: SATISFIED (TRD-001-TEST) — ACs: AC-001-1, AC-001-2'
            - '    REQ-002: NOT VERIFIED (TRD-002-TEST still open)'
            - '    TOTAL: <N> satisfied / <M> total requirements'
            - '    ========================================'
            - 'If TRD_MODE=false: print "Requirement Satisfaction: N/A (no TRD — run with --trd <path> to enable traceability tracking)"'
            - 'Run: br sync --flush-only'
            - 'If BV_AVAILABLE: run bv --robot-triage --format toon for final progress summary'
            - 'PR reminder (TRD-015): this command never auto-creates a PR regardless of PR_BACKEND — it only ever prints a reminder naming the resolved backend''s manual steps (mirroring TRD-010''s three backend behaviors, minus the ado MCP-tool-preferred attempt, since this file''s whole design is remind-not-automate).'
            - 'If PR_BACKEND==''gh'': remind user: git diff main...<branch>; gh pr create; after merge: move any TRD file to docs/TRD/completed/'
            - 'If PR_BACKEND==''ado'': remind user: git push -u origin <branch>; az repos pr create --source-branch <branch> --target-branch main --title "<title>"; or via the portal: Repos > Pull Requests > New Pull Request, source=<branch>, target=main; after merge: move any TRD file to docs/TRD/completed/'
            - 'If PR_BACKEND==''manual'': remind user: git push -u origin <branch>; then create the PR yourself via gh pr create --base main (or the ADO CLI/portal equivalent if the remote is Azure DevOps); after merge: move any TRD file to docs/TRD/completed/'
            - 'Remind user: br sync --flush-only && node "$TRD_CLI" beads-stage <STAGE_SCOPE> && git commit -m "chore: final beads sync" (do not stage the whole .beads/ directory: in a repo that tracks the export the shared beads database can add beads of other TRDs to this commit; see docs/guides/beads-tracked-export.md)'
            - 'TIP: /ensemble:implement-trd-beads <trd-path> drives this same engine with full scaffold, traceability validation, and the Design Readiness gate; /ensemble:beads-build <epic> --plan prints the plan without executing.'
            - 'Do NOT auto-create PR — user must create it manually per the PR_BACKEND-specific reminder above'

    - name: Plan Mode
      order: 5
      steps:
        - order: 1
          title: Read-only Plan (only when PLAN_ONLY=true)
          description: Print the scope summary and the next wave plan, then exit. Creates, closes, labels, commits and stages nothing.
          actions:
            - 'Resolve ROOT_EPIC_ID and EPIC_SLUG exactly as Epic Discovery does (br show for an id, else slug match over br list --status=open --json; zero or multiple matches -> print the error and HALT). Do not run the resume, clean-tree or label-backfill actions.'
            - 'Run: br sync --flush-only. Count open, in_progress and closed beads under the epic (br list --status=<s> --json for each, issue list is the parsed JSON if an array, otherwise its `.issues` array; closed uses --all --limit 0; filter by LABEL when set, else by EPIC_SLUG in .title) and print: "=== EPIC SCOPE: <EPIC_SLUG> (bead: <ROOT_EPIC_ID>) === Open: <n> | In-progress: <n> | Closed: <n>".'
            - 'If BV_AVAILABLE: run bv --robot-plan --format toon (add --label <LABEL> when set) and bv --robot-triage --format toon; print the parallel tracks, recommendations, quick wins and blockers. On a bv failure print a warning and use the br-only view. If BV_AVAILABLE=false: print "bv unavailable - showing br ready output" followed by br ready --json filtered to the scope.'
            - 'Print: "Run /ensemble:beads-build <ROOT_EPIC_ID> to execute. For TRD-driven work run /ensemble:implement-trd-beads <trd-path>." Then exit.'

expectedInput:
  format: Bead hierarchy reference with optional TRD path
  sections:
    - name: Epic ID or Slug Pattern
      required: true
      description: Direct bead ID (any prefix, e.g. beads-12 or cribs-l4pd) or text substring to search in epic titles

    - name: TRD Path
      required: false
      description: Path to TRD file for enabling traceability tokens, checkbox sync, and requirement report

expectedOutput:
  format: Implemented features with quality gates and beads tracking
  structure:
    - name: Closed Beads
      description: All task and story beads closed with quality gate comments recorded via br comment add

    - name: Feature Branch
      description: Git feature branch with implementation commits and phase checkpoint commits

    - name: TRD Checkboxes
      description: TRD Master Task List updated with completed checkboxes synced to bead closure state (TRD_MODE only)

    - name: Completion Report
      description: Summary with epic ID, coverage metrics, PR creation reminder, and optional Requirement Satisfaction Table

    - name: Requirement Satisfaction Report
      description: Table of PRD REQ-NNN requirements with SATISFIED/NOT VERIFIED status, test task references, and proven AC sub-IDs (TRD_MODE only)
