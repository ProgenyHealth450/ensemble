api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: investigate-test-failure
  version: 1.0.0
  digest: b92ec88331864a9fecc6fc64e541bab31b0552bbbe754092aaa9082a6f6d068f
trigger:
  event_type: test.failure.observed
  predicate:
    # Must match the runners actually used, not a plausible-looking list.
    # The previous regex ("npm test|mix test|pytest|go test") could not match
    # `npx jest`, which is this repo's own test command (packages/*/package.json
    # declare "test": "jest") and the command used throughout dogfooding -- so
    # this behavior could never have fired for a real failure here.
    command: { matches: "npm test|npx jest|jest|vitest|mix test|pytest|go test|cargo test" }
    isError: { equals: true }
policy:
  mode: propose
  timeout: 30m
capabilities:
  tools: [read, grep, glob, ensemble.bash]
  mutation_classes: [artifact.write, pr.open, constitution.propose]
  # Read-only investigation only. This package deliberately does NOT declare
  # `fix.propose`: it is the example that observes and reports, and
  # `fix-failing-test` is the one that proposes. Keeping them separate is what
  # makes the capability lists mean something when read side by side.
  commands: [investigation.record]
execution:
  graph: investigate-test-failure
  workflow:
    schema_version: "1.0.0"
    start: investigate
    steps:
      - id: investigate
        kind: agent
        prompt: prompts/investigate.md
        tools: [read, grep, glob]
        expect: json
        timeout: 10m
        attempts: 2
        max_output_bytes: 131072
        inputs:
          command: ${event.payload.command}
          failureOutput: ${event.payload.output}
        on_failure: inconclusive

      - id: record-diagnosis
        kind: command
        command: investigation.record
        timeout: 30s
        args:
          command: ${event.payload.command}
          diagnosis: ${steps.investigate.diagnosis}
          confidence: ${steps.investigate.confidence}
          evidence: ${steps.investigate.evidence}
        on_failure: inconclusive

      - id: investigated
        kind: outcome
        outcome: test.failure.investigated
        status: succeeded
        evidence:
          - ${steps.investigate.diagnosis}

      - id: inconclusive
        kind: outcome
        outcome: test.failure.investigated
        status: inconclusive
outcomes:
  - test.failure.investigated
  - constitution.change.proposed
