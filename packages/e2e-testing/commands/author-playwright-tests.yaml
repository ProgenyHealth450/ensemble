metadata:
  name: ensemble:author-playwright-tests
  description: Interactive, post-implementation Playwright test-authoring session grounded in shipped code and PRD acceptance criteria
  version: 1.0.0
  lastUpdated: "2026-07-24"
  category: testing
  output_path: ensemble/author-playwright-tests.md
  source: fortium
  argument_hint: "[story-or-pr-reference]"

mission:
  summary: |
    Walk a story's PRD acceptance criteria one at a time with a QA engineer after
    implement-trd-beads has shipped a PR boundary, grounding each proposed Playwright
    test in the real implementing code rather than PRD prose alone, running it against
    the target application's QA environment, and syncing confirmed tests to an Azure
    DevOps Test Case/Suite as plain-English steps.

constraints:
  noNewInfra:
    requirement: REQ-015
    title: No New Paid Infra
    description: |
      This is a standing constraint on the whole session, not a workflow step:
      author-playwright-tests must operate entirely within the environment
      already available to it. Never provision, subscribe to, or stand up any
      new service, tool, or paid infrastructure to support test authoring,
      grounding, execution, or Azure DevOps sync.
    rules:
      - id: AC-015-1
        description: >
          Use only the Azure DevOps MCP server, Playwright, and Claude Code
          already available in this environment to run this session. Do not
          provision, install, or configure any new service.
      - id: AC-015-2
        description: >
          If the session needs a capability that no currently-available MCP
          server or tool provides, stop and report that gap explicitly to the
          QA engineer — do not silently work around it with an ad hoc script,
          scraped/hand-rolled workaround, or new dependency.

workflow:
  phases:
    - name: Scaffold
      order: 1
      steps:
        - order: 1
          title: Trigger Check — Open PR Required
          description: |
            REQ-001: this session may only start once implement-trd-beads has
            shipped a PR boundary for the target branch. Before proceeding,
            call packages/e2e-testing/lib/pr-state.js's checkPrState(branch)
            with the current branch (or the story/PR reference passed as the
            command argument, resolved to a branch name) to determine whether
            an open PR exists.
          actions:
            - 'Resolve the target branch: current git branch, or the branch backing the story/PR reference argument'
            - 'Call checkPrState(branch) from packages/e2e-testing/lib/pr-state.js'
            - 'If hasOpenPr is false: halt the session and print pr-state.js''s NO_OPEN_PR_MESSAGE (run /ensemble:implement-trd-beads first) — do not proceed to grounding, execution, or sync'
            - 'If hasOpenPr is true: proceed with the session on that same branch/PR — all authored test commits land there'

        - order: 2
          title: Command Registration
          description: |
            Placeholder step confirming the command is scaffolded and registered.
            The interactive walkthrough, implementation grounding, execution, and
            Azure DevOps sync logic are implemented in later TRD tasks.

expectedInput:
  description: Story or PR reference identifying the shipped PR boundary to author tests against
  formats:
    - Story ID or branch name with an open PR
  examples:
    - "/ensemble:author-playwright-tests STORY-123"

expectedOutput:
  format: Confirmed Playwright tests synced to Azure DevOps
  structure:
    - name: Test Files
      description: Playwright test specs landed for confirmed acceptance criteria
    - name: Azure DevOps Test Cases
      description: Plain-English steps synced to the target ADO Test Case/Suite
