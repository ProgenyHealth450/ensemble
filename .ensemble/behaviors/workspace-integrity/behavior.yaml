api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: workspace-integrity
  version: 1.0.0
trigger:
  # One of the few trigger types the harness genuinely emits, so this behavior
  # actually fires (br-jgxo, br-d7lm). Session start is also the only useful
  # moment: the point is to find latent breakage BEFORE it wastes a session,
  # not to explain it afterwards.
  event_type: runtime.session.started
policy:
  # `propose`, and it will stay there. The finding is a fact, but the remedy
  # is `npm install`, which is the developer's call. A runtime that silently
  # rewrote a dependency tree would be a far worse problem than the one it
  # fixed, so `auto` is not a future upgrade path here -- it is a category
  # error.
  mode: propose
  # Short by design. This runs on every session start; a check that can hang
  # for minutes at startup will be disabled by whoever it first annoys.
  timeout: 30s
capabilities:
  # No tools. The check reads the filesystem through a command, so the
  # behavior itself needs no grants at all -- not even `read`.
  tools: []
  mutation_classes: []
  commands:
    - workspace.check
execution:
  graph: workspace-integrity
  workflow:
    schema_version: "1.0.0"
    start: check
    steps:
      # No agent step. Every judgement here is mechanical -- a symlink either
      # resolves or it does not -- and involving a model would add latency and
      # cost to a startup path in exchange for a new way to be wrong.
      - id: check
        kind: command
        command: workspace.check
        args: {}
        next: classify

      - id: classify
        kind: condition
        left: ${steps.check.result.ok}
        operator: equals
        right: true
        then: healthy
        otherwise: report

      - id: healthy
        kind: outcome
        outcome: behavior.completed
        status: succeeded
        evidence:
          # The counts, not just the verdict. "Nothing wrong" from a check that
          # examined nothing is the most reassuring possible lie, and this
          # workspace's original breakage hid behind exactly that kind of
          # silence.
          - "workspace integrity: no findings"
          - ${steps.check.result.checked.linkCount}

      - id: report
        kind: outcome
        outcome: behavior.completed
        # `inconclusive`, not `failed`. Nothing has failed yet: the workspace
        # is misconfigured, which is a condition, not an error, and calling it
        # a failure would put it in the same bucket as real breakage.
        status: inconclusive
        evidence:
          - "workspace integrity: findings require attention -- run npm install"
          - ${steps.check.result.findings}
outcomes:
  - behavior.completed
