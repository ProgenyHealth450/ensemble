api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: vacuous-test-run
  version: 1.0.0
trigger:
  # `test.passed` is emitted ONLY for a run that reported it executed nothing
  # (event-translator.ts). A healthy suite still translates to no event at
  # all, so this behavior cannot fire on working code.
  #
  # The predicate is belt-and-braces rather than redundant: if the translator
  # is ever widened to emit `test.passed` for healthy runs, this behavior
  # must not start firing on them by inheritance.
  event_type: test.passed
  predicate:
    nothingRan: { equals: true }
policy:
  # `shadow` would be too quiet -- the point is to say something. `auto` would
  # be wrong: this behavior has no business changing anything, and declaring
  # a mode that permits writes it will never make is how a capability drifts
  # into being used.
  mode: propose
  timeout: 2m
capabilities:
  tools: []
  mutation_classes: []
  # Deliberately empty. This behavior reports; it does not act. A report that
  # could also mutate is a different, much larger claim on your trust.
  commands: []
execution:
  graph: vacuous-test-run
  workflow:
    schema_version: "1.0.0"
    start: classify
    steps:
      # No agent step anywhere in this workflow. The judgement was already
      # made mechanically by the translator, and asking a model to re-decide
      # something a regex settled adds latency, cost and a way to be wrong.
      - id: classify
        kind: condition
        left: ${event.payload.testsReported}
        operator: exists
        then: reported-zero
        otherwise: said-nothing-ran

      # Split so the report is specific. "It told us zero" and "it told us it
      # ran nothing" send a reader to different places: the first usually
      # means a path or filter matched no files, the second that the runner
      # found no suite at all.
      #
      # The distinguishing text lives in `evidence`, because OutcomeStep has
      # no message field. Without these literals the two branches would be
      # byte-identical and the split would be decoration.
      - id: reported-zero
        kind: outcome
        outcome: behavior.completed
        status: inconclusive
        evidence:
          - "vacuous: the run reported a total of zero tests"
          - ${event.payload.command}
          - ${event.payload.cwd}

      - id: said-nothing-ran
        kind: outcome
        outcome: behavior.completed
        status: inconclusive
        evidence:
          - "vacuous: the run stated outright that no tests ran"
          - ${event.payload.command}
          - ${event.payload.cwd}
outcomes:
  # `inconclusive`, never `failed`. The suite did not fail -- that is exactly
  # the problem. Calling it a failure would be its own false claim, and would
  # put this behavior's output in the same bucket as real breakage.
  - behavior.completed
