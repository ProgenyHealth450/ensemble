api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: doc-claim-check
  version: 1.0.0
trigger:
  # Genuinely emitted since br-gpha: derived from a successful git commit,
  # merge, rebase, revert, cherry-pick or apply. Before that this type was
  # declared in the catalog and produced by nothing, which would have made
  # this behavior inert no matter how correct the rest of it was.
  #
  # NOT repository.branch.created: creating a branch changes no files, so
  # re-verifying documentation on it would be pure noise.
  event_type: repository.changed
policy:
  mode: propose
  timeout: 5m
capabilities:
  # `read` only. The extraction step has to open changed markdown; it has no
  # business writing, and the adjudication happens in a command that takes no
  # tools at all.
  tools:
    - read
  mutation_classes: []
  commands:
    - doc.verify
execution:
  graph: doc-claim-check
  workflow:
    schema_version: "1.0.0"
    start: extract
    steps:
      # Flow is DECLARATION ORDER. There is no `next:` field: a non-condition
      # step falls through to the step declared after it, and only a condition
      # redirects (br-n3gj). Reordering these steps rewires the workflow.
      #
      # The model PROPOSES; it never adjudicates. That split is the safeguard,
      # not a style choice: the fabrications this behavior exists to catch
      # included invented line citations produced by grepping a file after
      # inserting a note and reading it back as corroboration. A proposer that
      # also decides confirms whatever it already believes.
      - id: extract
        kind: agent
        prompt: prompts/extract.md
        tools:
          - read
        # JSON, not prose. A step that accepted prose would let "I checked the
        # docs and they look fine" pass as a result — which is the exact shape
        # of the problem, a confident claim with nothing behind it.
        expect: json
        max_output_bytes: 32000
        timeout: 3m
        inputs:
          command: ${event.payload.command}
          cwd: ${event.payload.cwd}

      - id: check
        kind: command
        command: doc.verify
        args:
          claims: ${steps.extract.result.claims}

      - id: classify
        kind: condition
        left: ${steps.check.result.ok}
        operator: equals
        right: true
        then: all-hold
        otherwise: unresolved

      - id: all-hold
        kind: outcome
        outcome: behavior.completed
        status: succeeded
        evidence:
          - "documentation claims all resolve against the tree"
          - ${steps.check.result.checked}

      - id: unresolved
        kind: outcome
        outcome: behavior.completed
        # `inconclusive`, not `failed`. Two different situations land here:
        # claims that genuinely do not resolve, AND the case where nothing
        # checkable was found at all (doc.verify reports ok: false for an
        # empty set, because "nothing to check" is not "everything checked
        # out"). Neither is a failure of the code under change.
        status: inconclusive
        evidence:
          - "documentation claims did not all resolve"
          - ${steps.check.result.unresolved}
outcomes:
  - behavior.completed
