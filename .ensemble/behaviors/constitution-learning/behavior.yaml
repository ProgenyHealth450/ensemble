api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: constitution-learning
  version: 1.0.0
trigger:
  # VERIFIED evidence, not the original failure (REQ-SAFE-008, §4).
  #
  # This is the whole design decision. Triggering on `test.failure.observed`
  # would let the system amend its own constitution from a guess about a
  # failure it had not yet understood. Triggering on `fix.verified` with
  # `verdict: passed` means the amendment reasons about something that was
  # independently checked.
  #
  # The predicate is load-bearing: `fix.verified` is emitted for failed and
  # inconclusive verdicts too, precisely so those facts are recorded, and this
  # behavior must not fire on them.
  event_type: fix.verified
  predicate:
    verdict: { equals: passed }
policy:
  mode: propose
  timeout: 30m
capabilities:
  tools: [read, grep, glob]
  mutation_classes: []
  # Proposes only. `constitution.apply` is deliberately absent: applying an
  # amendment is a separate, human-approved transition, and a behavior that
  # could do both would make "approval and application are separate facts"
  # untrue in practice however it was documented.
  commands:
    - constitution.propose
execution:
  graph: constitution-learning
  workflow:
    schema_version: "1.0.0"
    start: assess
    steps:
      # Most fixes imply no rule. A one-line arithmetic bug legitimately
      # warrants no constitution change, and a system that produces an
      # amendment per fix produces noise that trains people to ignore it.
      - id: assess
        kind: agent
        prompt: prompts/assess.md
        tools: [read, grep, glob]
        expect: json
        timeout: 10m
        attempts: 2
        max_output_bytes: 131072
        inputs:
          proposalRef: ${event.payload.proposalRef}
          detail: ${event.payload.detail}
          command: ${event.payload.command}
        on_failure: no-change

      - id: warrants-a-rule
        kind: condition
        left: ${steps.assess.warrantsRule}
        operator: equals
        right: true
        then: propose-amendment
        otherwise: no-change

      - id: propose-amendment
        kind: command
        command: constitution.propose
        timeout: 60s
        args:
          rule: ${steps.assess.rule}
          rationale: ${steps.assess.rationale}
          diff: ${steps.assess.diff}
          # Required by the command's input schema with minItems 1, so an
          # amendment with no cited evidence cannot be expressed at all.
          sourceEvidence: ${steps.assess.sourceEvidence}
        on_failure: blocked

      - id: proposed
        kind: outcome
        outcome: constitution.proposed
        status: succeeded
        evidence:
          - ${steps.propose-amendment.proposalRef}

      - id: no-change
        kind: outcome
        outcome: constitution.no_change_warranted
        status: succeeded

      - id: blocked
        kind: outcome
        outcome: behavior.blocked
        status: blocked
outcomes:
  - constitution.proposed
  - constitution.no_change_warranted
  - behavior.blocked
