api_version: ensemble.sunstone.dev/v1
kind: Behavior
metadata:
  name: pre-pr-verification
  version: 1.0.0
trigger:
  # `pull_request.proposed` carries disposition LAUNCH-INPUT (br-d7lm): nothing
  # in this build emits it, and nothing here waits for it. It arrives because
  # Foreman starts a session with it as the triggering fact. That is a real
  # delivery mechanism, so this behavior is not inert -- but it also means the
  # behavior RUNS ALONGSIDE the PR, never in front of it.
  #
  # It therefore REPORTS. It does not gate. See the note in outcomes below:
  # the blocking half of this idea belongs in CI, and pretending otherwise
  # would be the second time this repo mistook an observer for a gate
  # (br-jg0l).
  event_type: pull_request.proposed
policy:
  mode: propose
  # Generous: a full suite plus typecheck and lint is the slowest thing the
  # runtime does. Still bounded, because an unbounded run outlives the session
  # that launched it and leaves an abandoned dispatch record (br-mr22).
  timeout: 20m
capabilities:
  tools: []
  mutation_classes: []
  commands:
    - verification.run
execution:
  graph: pre-pr-verification
  workflow:
    schema_version: "1.0.0"
    start: tests
    steps:
      # Each command runs in its own isolated workspace. Sequential rather
      # than merged into one shell line, because `a && b && c` reports only
      # the first failure and this is meant to tell you everything that is
      # wrong in one pass.
      #
      # FLOW IS DECLARATION ORDER. There is no `next:` field: a non-condition
      # step falls through to the step declared after it (interpreter.ts), and
      # only a condition redirects, via `then`/`otherwise`. So the order of
      # these steps is load-bearing -- reordering them silently rewires the
      # workflow. Terminal outcomes are declared last for that reason.
      - id: tests
        kind: command
        command: verification.run
        args:
          command: npm test

      # Vacuity is checked BEFORE the verdict, and this ordering is the whole
      # point of the bead. A vacuous run reports `inconclusive`, so a naive
      # "is it passed?" branch would route it to the failure arm and describe
      # "nothing ran" as "tests failed" -- which sends the reader to debug
      # code that was never executed.
      - id: check-tests
        kind: condition
        left: ${steps.tests.result.vacuous}
        operator: equals
        right: true
        then: vacuous
        otherwise: check-tests-verdict

      - id: check-tests-verdict
        kind: condition
        left: ${steps.tests.result.verdict}
        operator: equals
        right: passed
        then: typecheck
        otherwise: tests-failed

      - id: typecheck
        kind: command
        command: verification.run
        args:
          command: npm run typecheck

      - id: check-typecheck
        kind: condition
        left: ${steps.typecheck.result.verdict}
        operator: not_equals
        right: failed
        then: lint
        otherwise: typecheck-failed

      - id: lint
        kind: command
        command: verification.run
        args:
          command: npm run lint

      - id: check-lint
        kind: condition
        left: ${steps.lint.result.verdict}
        operator: not_equals
        right: failed
        then: clean
        otherwise: lint-failed

      - id: clean
        kind: outcome
        outcome: behavior.completed
        status: succeeded
        evidence:
          - "pre-PR verification: tests, typecheck and lint all clean"
          - ${steps.tests.result.detail}

      - id: vacuous
        kind: outcome
        outcome: behavior.completed
        # `inconclusive`, emphatically not `succeeded`. A gate that accepts
        # "Tests: 0 total, exit 0" is worse than no gate, because it
        # manufactures confidence in a change nothing checked.
        status: inconclusive
        evidence:
          - "pre-PR verification: the suite ran nothing -- this is not a pass"
          - ${steps.tests.result.detail}

      - id: tests-failed
        kind: outcome
        outcome: behavior.completed
        status: failed
        evidence:
          - "pre-PR verification: tests did not pass"
          - ${steps.tests.result.detail}

      - id: typecheck-failed
        kind: outcome
        outcome: behavior.completed
        status: failed
        evidence:
          - "pre-PR verification: typecheck failed"
          - ${steps.typecheck.result.detail}

      - id: lint-failed
        kind: outcome
        outcome: behavior.completed
        status: failed
        evidence:
          - "pre-PR verification: lint failed"
          - ${steps.lint.result.detail}
outcomes:
  - behavior.completed
